<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Box</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f4;
    }

    .search-container {
      position: relative;
      width: 300px;
    }

    .search-input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      outline: none;
      font-size: 16px;
    }

    .search-input:focus {
      border-color: #007bff;
    }

    .search-button {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
    }
    .grid{
        display: grid;
        grid-row: 1;
        grid-column: 1;
        gap:50px 50px;
        margin :auto;


    }
  </style>
</head>
<body>
  <div class="search-container">
    <input type="text" placeholder="Search..." class="search-input" />
    <button class="search-button">🔍</button>
  </div>
  <ul class="grid">
    <li>heillo</li>
    <li>heillo</li>
    <li>heillo</li>
    <li>heillo</li>
  </ul>

</body>
</html>
